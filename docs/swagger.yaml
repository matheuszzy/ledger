basePath: /
definitions:
  account.Account:
    properties:
      balance:
        example: 15
        format: double
        type: number
      id:
        example: "100"
        type: string
    type: object
  account.Event:
    properties:
      amount:
        example: 15
        format: double
        type: number
      destination:
        example: "300"
        type: string
      origin:
        example: "100"
        type: string
      type:
        enum:
        - deposit
        - withdraw
        - transfer
        example: transfer
        type: string
    type: object
  account.EventResult:
    properties:
      destination:
        $ref: '#/definitions/account.Account'
      origin:
        $ref: '#/definitions/account.Account'
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'Simple account ledger: deposits, withdrawals and transfers.'
  title: Ledger API
  version: "1.0"
paths:
  /balance:
    get:
      description: Returns the balance as plain text, or 0 with 404 when the account
        does not exist.
      parameters:
      - description: Account ID
        example: "100"
        in: query
        name: account_id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Current balance
          schema:
            format: double
            type: number
        "404":
          description: Account not found (body is 0)
          schema:
            type: integer
      summary: Get balance for an account
      tags:
      - ledger
  /event:
    post:
      consumes:
      - application/json
      description: deposit requires destination; withdraw requires origin; transfer
        requires both. Withdraw/transfer from a non-existing origin returns 404 with
        body 0.
      parameters:
      - description: Event
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/account.Event'
      produces:
      - application/json
      responses:
        "201":
          description: Updated accounts
          schema:
            $ref: '#/definitions/account.EventResult'
        "404":
          description: Origin account not found (body is 0)
          schema:
            type: integer
      summary: Deposit, withdraw or transfer
      tags:
      - ledger
  /reset:
    post:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Reset state before starting tests
      tags:
      - ledger
swagger: "2.0"
